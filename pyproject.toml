[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faulttrace-rag"
version = "0.1.0"
description = "Counterfactual Fault Localization for Corpus-Level LLM Analytics Pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "PyPDF2>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "sentence-transformers>=2.2.2",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "fastparquet>=2023.10.0",
    "pyarrow>=14.0.0"
]

[tool.setuptools.packages.find]
where = ["packages", "apps"]
include = ["faulttrace_*"]

[project.scripts]
faulttrace = "faulttrace_core.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages", "apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "B008", "N805", "B904", "N806", "B017", "E402", "N803", "A002", "B023", "N815", "SIM102", "E741", "UP007", "F601", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
exclude = ["migrations", "alembic"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["packages", "apps/api/faulttrace_api"]
omit = ["*/tests/*", "*/migrations/*"]
