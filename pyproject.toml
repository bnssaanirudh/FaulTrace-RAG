[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faulttrace-rag"
version = "0.1.0"
description = "Counterfactual Fault Localization for Corpus-Level LLM Analytics Pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "typer>=0.12.0",
    "pandas>=2.2.0",
    "duckdb>=1.0.0",
    "pyarrow>=16.0.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "beautifulsoup4>=4.12.0",
    "PyPDF2>=3.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "orjson>=3.10.0",
]
llm = [
    "openai>=1.35.0",
    "tiktoken>=0.7.0",
]
retrieval = [
    "rank_bm25>=0.2.2",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.1",
]
research = [
    "matplotlib>=3.8.0",
    "PyYAML>=6.0.0",
]
baselines = [
    "ragchecker",
    "ragas",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["packages", "apps"]
include = ["faulttrace_*"]

[project.scripts]
faulttrace = "faulttrace_core.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages", "apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "B008", "N805", "B904", "N806", "B017", "E402", "N803", "A002", "B023", "N815", "SIM102", "E741", "UP007", "F601", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
exclude = ["migrations", "alembic"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["packages", "apps/api/faulttrace_api"]
omit = ["*/tests/*", "*/migrations/*"]
