name: FaultTrace-RAG CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Python Backend ─────────────────────────────────────────────────────────
  backend:
    name: Python ${{ matrix.python-version }} — Backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check . --select=E,W,F,N,I --ignore=E501

      - name: Type check (mypy)
        run: mypy packages/core packages/gold packages/pipelines --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # Treat as warning for now; upgrade to error once stubs are complete

      - name: Run tests
        run: |
          pytest apps/api/tests/ -v \
            --tb=short \
            --timeout=120 \
            -x \
            --ignore=apps/api/tests/test_smoke.py
        env:
          FAULTTRACE_ENV: test
          DATABASE_URL: sqlite:///./test_ci.db

      - name: Check test coverage threshold
        run: |
          pytest apps/api/tests/ \
            --cov=apps/api/faulttrace_api \
            --cov=packages \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --ignore=apps/api/tests/test_smoke.py \
            -q
        env:
          FAULTTRACE_ENV: test
          DATABASE_URL: sqlite:///./test_ci.db
        continue-on-error: true  # Coverage gate is informational until full test backfill

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Node ${{ matrix.node-version }} — Frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npx eslint . --ext .ts,.tsx --max-warnings=20
        continue-on-error: true

      - name: Build (production bundle validation)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Release Check Gate ────────────────────────────────────────────────────
  release-check:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: All checks passed
        run: echo "✅ Backend and Frontend checks passed. Ready for release."
